name: Release

# FR-8.1: trigger on version tag push (v*)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-and-release:
    name: Build artifact and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for auto-generated release notes

      - name: Validate tag format
        # install.sh only accepts vX.Y.Z; a tag it would refuse must not
        # become a release, and a prerelease tag must not become "latest".
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Tag $TAG is not vX.Y.Z — install.sh would refuse it" >&2; exit 1; }

      - name: Framework lint
        # word budgets, forbidden references, frontmatter, path existence
        run: bash tests/framework/lint.sh

      - name: Bash suite
        # every tests/**/*_test.sh — the same set CI runs on the way in
        run: bash tests/run.sh

      - name: PowerShell suite
        shell: pwsh
        run: |
          ./tests/pwsh/args_test.ps1
          ./tests/pwsh/install_test.ps1

      - name: Build release artifact
        # FR-8.2: produce .tar.gz and .zip containing all distributable files
        run: |
          bash scripts/build-release.sh "${{ github.ref_name }}"

      - name: Create GitHub Release
        # FR-8.5: create release with artifact attached and auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            prospect-${{ github.ref_name }}.tar.gz
            prospect-${{ github.ref_name }}.zip
